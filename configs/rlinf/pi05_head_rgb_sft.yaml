defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:PI05_RUN_DIR}/training
    project_name: real_world_rl
    experiment_name: pi05_head_rgb
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 100

data:
  train_data_paths: ${oc.env:PI05_REPO_ID}
  num_workers: 0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42
  model:
    precision: fp32
    model_path: ${oc.env:PI05_MODEL_PATH}
    action_dim: 8
    num_action_chunks: 10
    openpi:
      task: sft
      config_name: pi05_head_rgb
      action_horizon: 10
      discrete_state_input: true
      embed_dtype: bf16
      num_images_in_input: 1
    openpi_data:
      norm_stats_path: ${oc.env:PI05_RUN_DIR}/assets/pi05_head_rgb/${oc.env:PI05_REPO_ID}/norm_stats.json
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 100
    lr_scheduler: openpi_cosine
    min_lr: 1.0e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false
critic:
  use_critic_model: false
